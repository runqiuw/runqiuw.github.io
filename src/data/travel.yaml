# Pins on the travel map above the room's TV, one entry per pin. The poster shows the world with one
# big pin per region; in the map's close-up, clicking it zooms into that region's own map, where each
# entry below has its pin and name. Clicking a pin there fans out its photos; clicking anywhere else
# folds them back, and clicking again goes back out to the world.
# Big cities get their own pin; satellite cities fold into their city, and road-trip stops into one
# pin for the trip. Not on the map: airport stopovers (Grapevine, Incheon) and single passing photos
# (Chaoyang, East Lansing). After editing, run
#   node bin/room-travel.mjs
# which redraws the poster and region maps and writes public/room/travel/ (photos resized to 640 px,
# EXIF/GPS dropped).
#
# - id: short-slug
#   region: china                  # which zoomed-in map it belongs to (us, europe, china)
#   place: Kyoto
#   lnglat: [135.768, 35.012]        # longitude, latitude
#   when: April 2024                 # optional
#   photos:
#     - src: photos/travel/kyoto/torii.jpg   # repo-relative original
#       caption: Fushimi Inari before the crowds
#     - placeholder: Kyoto           # a generated stand-in until the real photo exists
#
# Every photo below is still a placeholder: replace them with real photos.
