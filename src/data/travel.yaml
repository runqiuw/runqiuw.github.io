# Places on the travel map above the room's TV, one entry per place. Places too close to have
# separate pins on the poster share one pin (bin/room-travel.mjs groups them). In the map's
# close-up, clicking a pin fans out that pin's photos; clicking anywhere else folds them back.
# After editing, run
#   node bin/room-travel.mjs
# which redraws the poster and writes public/room/travel/ (photos resized to 640 px, EXIF/GPS dropped).
#
# - id: short-slug
#   place: Kyoto
#   lnglat: [135.768, 35.012]        # longitude, latitude
#   when: April 2024                 # optional
#   photos:
#     - src: photos/travel/kyoto/torii.jpg   # repo-relative original
#       caption: Fushimi Inari before the crowds
#     - placeholder: Kyoto           # a generated stand-in until the real photo exists
#
# Every photo below is still a placeholder: replace them with real photos.
